[package]
name = "proxifyre"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]

# Core networking
ipnetwork = "0.20"
socket2 = "0.5"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }

# Windows-specific
ndisapi = "0.6.5"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

# Packet parsing
smoltcp = { version = "0.11", default-features = false, features = ["proto-ipv4", "proto-ipv6", "std", "medium-ethernet", "socket-udp"] }

# CLI/TUI
crossterm = "0.28"
ratatui = "0.28"
unicode-width = "0.1"

# Utilities
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
humantime = "2.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
