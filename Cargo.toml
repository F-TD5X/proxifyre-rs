[package]
name = "proxifyre"
version = "0.1.0"
edition = "2024"


[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]

# NDIS API for Windows packet filtering
ndisapi = "0.6.5"
anyhow = "1.0"
ipnetwork = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smoltcp = { version = "0.11", default-features = false, features = ["proto-ipv4", "proto-ipv6", "std", "medium-ethernet", "socket-udp"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "signal", "time"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
socket2 = "0.5"
